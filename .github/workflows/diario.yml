name: Fábrica GTA

on:
  schedule:
    # Pregunta cada 30 minutos si hay un turno pendiente (los horarios están en config.json → turnos).
    # GitHub a veces avisa con demora: por eso cada turno tiene una ventana de unas horas para salir.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno (1, 2, 3... según config.json). Vacío = el que toque"
        required: false
        default: ""
      tipo:
        description: "Forzar el tipo: clip, novedad o guia. Vacío = el del turno"
        required: false
        default: ""
      publicar:
        description: "¿Publicar en las redes? (si no, solo genera el video y lo ves acá)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fabrica-gta
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      si: ${{ steps.toca.outputs.si }}
      turno: ${{ steps.toca.outputs.turno }}
      fecha: ${{ steps.toca.outputs.fecha }}
    env:
      TURNO_MANUAL: ${{ inputs.turno }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - id: toca
        name: ¿Hay un turno pendiente?
        run: python -m fabrica.main toca

  fabricar:
    needs: reloj
    if: needs.reloj.outputs.si == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TURNO: ${{ needs.reloj.outputs.turno }}
      FECHA_TURNO: ${{ needs.reloj.outputs.fecha }}
      TIPO: ${{ inputs.tipo }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_FB_TOKEN: ${{ secrets.IG_FB_TOKEN }}
      IG_FB_ID: ${{ secrets.IG_FB_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Modelo de Whisper en caché
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          pip install -q -U yt-dlp
          mkdir -p fonts
          for f in ofl/anton/Anton-Regular.ttf ofl/poppins/Poppins-SemiBold.ttf ofl/poppins/Poppins-Bold.ttf ofl/poppins/Poppins-Black.ttf; do
            curl -fsSL -o "fonts/$(basename $f)" "https://github.com/google/fonts/raw/main/$f" || echo "No bajó $f"
          done

      - name: Buscar, editar y revisar el video
        run: python -m fabrica.main generar

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/sitio
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Esperar a que el video esté online
        run: python -m fabrica.main online --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Mandarte el video por mail
        if: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: python -m fabrica.main listo --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Esperar tu respuesta (5 minutos)
        id: espera1
        if: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: python -m fabrica.main esperar

      # ---- Si pediste «Otro clip / otro tema»: se arma otro y se vuelve a esperar ----
      - name: Armar otro
        if: ${{ steps.espera1.outputs.decision == 'otro' }}
        run: python -m fabrica.main generar --otro
      - if: ${{ steps.espera1.outputs.decision == 'otro' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/sitio
          name: github-pages-2
      - id: deployment2
        if: ${{ steps.espera1.outputs.decision == 'otro' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-2
      - if: ${{ steps.espera1.outputs.decision == 'otro' }}
        run: python -m fabrica.main online --base-url "${{ steps.deployment.outputs.page_url }}"
      - if: ${{ steps.espera1.outputs.decision == 'otro' }}
        run: python -m fabrica.main listo --base-url "${{ steps.deployment.outputs.page_url }}"
      - id: espera2
        if: ${{ steps.espera1.outputs.decision == 'otro' }}
        run: python -m fabrica.main esperar --ultima

      - name: Publicar en las redes
        if: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: python -m fabrica.main publicar --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Resumen (prueba sin publicar)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publicar }}
        run: python -m fabrica.main resumen --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Vigía de campañas de clipping
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        run: python -m fabrica.main vigia

      - name: Guardar historial
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publicar) }}
        run: |
          git config user.name "fabrica-gta-bot"
          git config user.email "fabrica-gta-bot@users.noreply.github.com"
          RAMA="${{ github.ref_name }}"
          rm -rf /tmp/nuestros && mkdir -p /tmp/nuestros/data /tmp/nuestros/publicaciones /tmp/nuestros/notas
          for f in data/historial.json data/usados.json data/estado.json data/campanas.json; do
            [ -f "$f" ] && cp "$f" "/tmp/nuestros/$f"
          done
          cp publicaciones/*.md /tmp/nuestros/publicaciones/ 2>/dev/null || true
          cp notas/*.md /tmp/nuestros/notas/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin "$RAMA"
            git reset -q --hard "origin/$RAMA"
            cp -r /tmp/nuestros/. .
            git add data publicaciones notas 2>/dev/null || true
            git diff --cached --quiet && { echo "Nada nuevo para guardar."; exit 0; }
            git commit -q -m "Historial $(date +%F) [skip ci]"
            git push -q origin "HEAD:$RAMA" && { echo "Historial guardado."; exit 0; }
            sleep $((i * 10))
          done
          echo "No se pudo guardar el historial" && exit 1
